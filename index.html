
<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IUPD Tomas Taraskevičius Rusijos-Ukrainos karo žemėlapis</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    :root {
      --gap: 16px;
      --panel-width: 290px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f7f9;
      overflow: hidden;
    }

    body {
      position: relative;
    }

    .map-area {
      position: fixed;
      inset: 0;
      background: #fff;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #e9edf2;
    }

    .panel {
      position: fixed;
      top: var(--gap);
      right: var(--gap);
      width: var(--panel-width);
      max-height: calc(100vh - (var(--gap) * 2));
      overflow: auto;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(4px);
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.10);
      z-index: 1000;
    }

    .panel h3 {
      margin: 0 0 10px 0;
      font-size: 16px;
    }

    select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      background: #fff;
      font-size: 14px;
    }

    .badge {
      display: inline-block;
      margin-top: 10px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #eef2ff;
      border: 1px solid #d9ddff;
      font-size: 12px;
    }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #cfd6ff;
      background: #f2f5ff;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }

    button:hover {
      background: #e9eeff;
    }

    textarea {
      width: 100%;
      margin-top: 10px;
      min-height: 120px;
      border-radius: 10px;
      border: 1px solid #ddd;
      padding: 10px;
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      resize: vertical;
    }

    .legend {
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      background: #fafafa;
      border: 1px solid #e5e5e5;
      font-size: 12px;
      line-height: 1.5;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }

    .legend-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #6aa84f;
      flex: 0 0 auto;
    }

    .legend-icon {
      width: 22px;
      height: 22px;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .legend-color-box {
      width: 18px;
      height: 12px;
      border-radius: 3px;
      border: 1px solid rgba(0, 0, 0, 0.25);
      flex: 0 0 auto;
    }

    .legend-color-box.ukraine {
      background: #25AFDD;
    }

    .legend-color-box.russia {
      background: #9B081B;
    }

    .legend-color-box.occupied {
      background: #975267;
    }

    .popup-title {
      font-size: clamp(14px, 2.2vw, 16px);
      font-weight: 700;
      margin-bottom: 6px;
      line-height: 1.25;
    }

    .popup-meta {
      font-size: clamp(11px, 1.8vw, 12px);
      color: #555;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .popup-text {
      font-size: clamp(12px, 2vw, 13px);
      line-height: 1.5;
    }

    .popup-media {
      margin: 10px 0 12px 0;
    }

    .popup-image {
      width: 100%;
      display: block;
      border-radius: 8px;
      border: 1px solid #ddd;
      margin-bottom: 8px;
      max-height: 28vh;
      object-fit: cover;
    }

    .leaflet-popup-content-wrapper {
      border-radius: 12px;
    }

    .leaflet-popup-content {
      width: min(78vw, 340px) !important;
      min-width: min(78vw, 340px);
      max-width: min(78vw, 340px);
      margin: 12px 14px;
    }

    .leaflet-control-attribution {
      font-size: 11px;
    }

    .battle-wrapper {
      position: relative;
      width: 46px;
      height: 24px;
      overflow: visible;
      pointer-events: none;
    }

    .battle-hit {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      background-image: url("assets/battle.png");
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      pointer-events: auto;
      cursor: pointer;
    }

    .battle-hit.large {
      width: 30px;
      height: 30px;
      left: 12px;
    }

    .battle-hit.small {
      width: 18px;
      height: 18px;
      left: 12px;
    }

    @media (max-width: 980px) {
      :root {
        --panel-width: auto;
      }

      .panel {
        top: auto;
        left: var(--gap);
        right: var(--gap);
        bottom: var(--gap);
        width: auto;
        max-height: 42vh;
      }
    }

    @media (max-width: 640px) {
      .leaflet-popup-content {
        width: 82vw !important;
        min-width: 82vw;
        max-width: 82vw;
        margin: 10px 12px;
      }

      .popup-image {
        max-height: 24vh;
      }
    }
  </style>
</head>

<body>
  <div class="map-area">
    <div id="map"></div>
  </div>

  <div class="panel" id="sidePanel">
    <h3>Metai</h3>

    <select id="yearSelect">
      <option value="2022" selected>2022</option>
      <option value="2023">2023</option>
      <option value="2024">2024</option>
      <option value="2025">2025</option>
      <option value="2026">2026</option>
    </select>

    <div class="badge" id="status">Rodomas: 2022</div>

    <button id="fitBtn">Rodyti visą žemėlapį</button>
    <button id="debugBtn">Debug: OFF</button>

    <div class="legend">
      <div><b>Legenda</b></div>

      <div class="legend-row">
        <span class="legend-color-box ukraine"></span>
        <span>Ukrainos teritorija</span>
      </div>

      <div class="legend-row">
        <span class="legend-color-box russia"></span>
        <span>Rusijos teritorija</span>
      </div>

      <div class="legend-row">
        <span class="legend-color-box occupied"></span>
        <span>Rusijos okupuota Ukrainos teritorija</span>
      </div>

      <div class="legend-row">
        <span class="legend-dot"></span>
        <span>Miestas / vietovė</span>
      </div>

      <div class="legend-row">
        <img class="legend-icon" src="assets/battle.png" alt="Battle" />
        <span>Mūšio / įvykio ikona</span>
      </div>
    </div>

    <textarea
      id="codeOut"
      readonly
      placeholder="Kai Debug ON ir paspausi žemėlapyje – čia atsiras procentinės koordinatės."
    ></textarea>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const yearSelect = document.getElementById("yearSelect");
    const status = document.getElementById("status");
    const debugBtn = document.getElementById("debugBtn");
    const fitBtn = document.getElementById("fitBtn");
    const codeOut = document.getElementById("codeOut");
    const sidePanel = document.getElementById("sidePanel");

    const map = L.map("map", {
      crs: L.CRS.Simple,
      zoomControl: true,
      minZoom: -5,
      maxZoom: 5,
      wheelPxPerZoomLevel: 120
    });

    let overlay = null;
    let currentBounds = null;
    let currentImageWidth = 0;
    let currentImageHeight = 0;
    let DEBUG = false;

    const eventLayer = L.layerGroup().addTo(map);
    const debugPointsLayer = L.layerGroup().addTo(map);

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error(`Nepavyko užkrauti: ${src}`));
        img.src = src;
      });
    }

    function getDynamicFitPadding() {
      const isMobile = window.innerWidth <= 980;
      const rect = sidePanel.getBoundingClientRect();

      if (isMobile) {
        return {
          paddingTopLeft: [4, 4],
          paddingBottomRight: [4, Math.ceil(rect.height) + 4]
        };
      }

      return {
        paddingTopLeft: [4, 4],
        paddingBottomRight: [Math.ceil(rect.width) + 4, 4]
      };
    }

    function fitToImage() {
      if (!currentBounds) return;

      const { paddingTopLeft, paddingBottomRight } = getDynamicFitPadding();

      map.fitBounds(currentBounds, {
        paddingTopLeft,
        paddingBottomRight,
        animate: false
      });
    }

    function clearDebug() {
      debugPointsLayer.clearLayers();
      codeOut.value = "";
    }

    function createBattleDivIcon(size = "normal") {
      const sizeClass = size === "large" ? "large" : size === "small" ? "small" : "normal";

      return L.divIcon({
        className: "",
        html: `
          <div class="battle-wrapper">
            <div class="battle-hit ${sizeClass}"></div>
          </div>
        `,
        iconSize: [46, 24],
        iconAnchor: [0, 12],
        popupAnchor: [24, -10]
      });
    }

    function escapeHtml(text) {
      return String(text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function roundPct(value) {
      return Number(value.toFixed(6));
    }

    function getEventYearRange(eventItem) {
      const yearText = String(eventItem.year || "").trim();

      const dateMatches = yearText.match(/\d{4}-\d{2}-\d{2}/g);
      if (dateMatches && dateMatches.length > 0) {
        const years = dateMatches.map(date => parseInt(date.slice(0, 4), 10));
        return {
          startYear: Math.min(...years),
          endYear: Math.max(...years)
        };
      }

      const yearMatches = yearText.match(/\b\d{4}\b/g);
      if (yearMatches && yearMatches.length > 0) {
        const years = yearMatches.map(y => parseInt(y, 10));
        return {
          startYear: Math.min(...years),
          endYear: Math.max(...years)
        };
      }

      return null;
    }

    function eventMatchesSelectedYear(eventItem, selectedYear) {
      const range = getEventYearRange(eventItem);
      if (!range) return false;

      const selected = parseInt(selectedYear, 10);
      return selected >= range.startYear && selected <= range.endYear;
    }

    function renderMediaHtml(eventItem) {
      if (!eventItem.image) return "";

      return `
        <div class="popup-media">
          <img
            class="popup-image"
            src="${escapeHtml(eventItem.image)}"
            alt="${escapeHtml(eventItem.title)}"
            onerror="this.style.display='none';"
          />
        </div>
      `;
    }

    function popupHtml(eventItem) {
      const places = eventItem.locations.map(item => item.place).join(", ");
      const categoryMap = {
        battle: "Mūšis",
        siege: "Apgultis",
        massacre: "Žudynės",
        strike: "Smūgis",
        offensive: "Puolimas / operacija",
        liberation: "Išlaisvinimas",
        frontline: "Fronto kovos",
        naval: "Jūrinis / pakrantės įvykis",
        sabotage: "Sabotažas / sprogimas"
      };

      const categoryLabel = categoryMap[eventItem.type] || "Istorinis įvykis";

      return `
        <div class="popup-title">${escapeHtml(eventItem.title)}</div>
        <div class="popup-meta">
          <b>Data:</b> ${escapeHtml(eventItem.year)}<br>
          <b>Tipas:</b> ${escapeHtml(categoryLabel)}<br>
          <b>Vieta:</b> ${escapeHtml(places)}
        </div>
        ${renderMediaHtml(eventItem)}
        <div class="popup-text">${escapeHtml(eventItem.description)}</div>
      `;
    }

    function getResponsivePopupOptions() {
      return {
        maxWidth: Math.min(window.innerWidth * 0.82, 340),
        minWidth: Math.min(window.innerWidth * 0.68, 220),
        autoPan: true,
        keepInView: true
      };
    }

    function addEventMarker(eventItem, loc) {
      const markerX = loc.xPct * currentImageWidth;
      const markerY = loc.yPct * currentImageHeight;

      const marker = L.marker([markerY, markerX], {
        icon: createBattleDivIcon(eventItem.size || "normal"),
        title: eventItem.title
      });

      marker.bindPopup(popupHtml(eventItem), getResponsivePopupOptions());
      marker.addTo(eventLayer);
    }

    function drawEvents(year) {
      eventLayer.clearLayers();

      const selectedEvents = HISTORICAL_EVENTS.filter(item => eventMatchesSelectedYear(item, year));

      selectedEvents.forEach(eventItem => {
        eventItem.locations.forEach(loc => addEventMarker(eventItem, loc));
      });
    }

    async function loadYear(year) {
      status.textContent = `Rodomas: ${year}`;

      const imgUrl = `assets/${year}.jpg?v=${Date.now()}`;

      try {
        const img = await loadImage(imgUrl);

        const w = img.naturalWidth;
        const h = img.naturalHeight;

        currentImageWidth = w;
        currentImageHeight = h;
        currentBounds = [[0, 0], [h, w]];

        if (overlay) {
          map.removeLayer(overlay);
        }

        overlay = L.imageOverlay(imgUrl, currentBounds).addTo(map);

        map.setMaxBounds([
          [-h * 0.2, -w * 0.2],
          [h * 1.2, w * 1.2]
        ]);

        map.invalidateSize();
        fitToImage();

        setTimeout(() => {
          map.zoomIn(1, { animate: false });
        }, 0);

        clearDebug();
        drawEvents(year);
      } catch (err) {
        console.error(err);
        alert(err.message);
      }
    }

    map.on("click", (e) => {
      if (!DEBUG || currentImageWidth <= 0 || currentImageHeight <= 0) return;

      const xPct = roundPct(e.latlng.lng / currentImageWidth);
      const yPct = roundPct(e.latlng.lat / currentImageHeight);

      const x = xPct * currentImageWidth;
      const y = yPct * currentImageHeight;

      L.circleMarker([y, x], {
        radius: 4,
        color: "#ff0000",
        weight: 2,
        fillColor: "#ff0000",
        fillOpacity: 0.8
      }).addTo(debugPointsLayer);

      codeOut.value += `{ place: "", xPct: ${xPct}, yPct: ${yPct} }\n`;
    });

    debugBtn.addEventListener("click", () => {
      DEBUG = !DEBUG;
      debugBtn.textContent = `Debug: ${DEBUG ? "ON" : "OFF"}`;
      clearDebug();
    });

    fitBtn.addEventListener("click", () => {
      map.invalidateSize();
      fitToImage();
      setTimeout(() => {
        map.zoomIn(1, { animate: false });
      }, 0);
    });

    yearSelect.addEventListener("change", () => {
      loadYear(yearSelect.value);
    });

    let resizeTimer = null;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        map.invalidateSize();
        fitToImage();
        setTimeout(() => {
          map.zoomIn(1, { animate: false });
        }, 0);
      }, 80);
    });

    const HISTORICAL_EVENTS = [
      {
        id: "hostomel-airport-2022",
        year: "2022-02-24 – 2022-02-25",
        title: "Hostomelio oro uosto mūšis",
        type: "battle",
        size: "large",
        image: "assets/photos/Hostomel.jpg",
        locations: [
          { place: "Hostomelis", xPct: 0.447548, yPct: 0.664647 }
        ],
        description: "Rusijos desantas bandė užimti oro uostą kaip placdarmą Kyjivo užėmimui. Ukraina sunaikino dalį desantininkų ir technikos bei neleido priimti papildomų pajėgų. Šis mūšis sužlugdė greito sostinės užėmimo planą."
      },
      {
        id: "kyiv-battle-2022",
        year: "2022-02-24 – 2022-04-02",
        title: "Kyjivo mūšis (2022)",
        type: "offensive",
        size: "large",
        image: "assets/photos/Kyiv.jpg",
        locations: [
          { place: "Brovarai", xPct: 0.472049, yPct: 0.656266 },
          { place: "Kyjivo sritis", xPct: 0.45947, yPct: 0.651238 }
        ],
        description: "Rusijos pajėgos bandė apsupti Kyjivą, tačiau susidūrė su stipriu pasipriešinimu ir logistinėmis problemomis. Per mūšį buvo sunaikinta daug technikos ir patirta didelių nuostolių. Balandžio pradžioje Rusija visiškai atsitraukė iš šiaurės Ukrainos."
      },
      {
        id: "chernihiv-battle-2022",
        year: "2022-02-24 – 2022-04-04",
        title: "Černihivo mūšis (2022)",
        type: "battle",
        size: "normal",
        image: "assets/photos/Chernihiv.jpg",
        locations: [
          { place: "Černihivas", xPct: 0.496634, yPct: 0.743756 }
        ],
        description: "Miestas buvo apsuptas ir nuolat bombarduojamas, sukeliant didelę civilių žalą. Nepaisant to, gynyba išsilaikė. Atsitraukdama Rusija paliko sunaikintą infrastruktūrą."
      },
      {
        id: "sumy-battle-2022",
        year: "2022-02-24 – 2022-04-08",
        title: "Sumų mūšis (2022)",
        type: "battle",
        size: "normal",
        image: "assets/photos/Sumy.jpg",
        locations: [
          { place: "Sumai", xPct: 0.662129, yPct: 0.693785 }
        ],
        description: "Rusijos daliniai bandė užimti regioną, bet susidūrė su Ukrainos kariuomenės pasipriešinimu. Miestas nebuvo užimtas, parodant Ukrainos gebėjimą gintis net prie sienos."
      },
      {
        id: "kharkiv-battle-2022",
        year: "2022-02-24 – 2022-05-14",
        title: "Charkovo mūšis (2022)",
        type: "battle",
        size: "large",
        image: "assets/photos/Kharkiv.jpg",
        locations: [
          { place: "Charkovas", xPct: 0.731887, yPct: 0.6140734 }
        ],
        description: "Charkovas, antras pagal dydį miestas, buvo intensyviai apšaudomas, ypač artilerija ir raketomis. Nepaisant didelių sugriovimų, Ukraina išlaikė miestą. Tai tapo svarbia moraline pergale."
      },
      {
        id: "mariupol-siege-2022",
        year: "2022-02-24 – 2022-05-20",
        title: "Mariupolio apgultis",
        type: "siege",
        size: "large",
        image: "assets/photos/Mariupol.jpg",
        locations: [
          { place: "Mariupolis", xPct: 0.793967, yPct: 0.365386 }
        ],
        description: "Miestas buvo visiškai apsuptas ir sunaikintas ilgų kovų metu. Žuvo tūkstančiai civilių, o infrastruktūra beveik visiškai sugriauta. Tai buvo viena didžiausių humanitarinių katastrofų kare. Po įviukių šiame mieste JAV prezidentas Joe Biden pirmąkart pavadino V. Putiną karo nusikalteliu."
      },
      {
        id: "azovstal-siege-2022",
        year: "2022-04-21 – 2022-05-20",
        title: "Azovstalio apgultis",
        type: "siege",
        size: "normal",
        image: "assets/photos/Mariupol.jpg",
        locations: [
          { place: "Mariupolis / Azovstalis", xPct: 0.795455, yPct: 0.361446 }
        ],
        description: "Paskutiniai Mariupolio gynėjai laikėsi Azovstalio plieno gamykloje. Ilgalaikė gynyba tapo pasipriešinimo simboliu. Galiausiai jie buvo priversti pasiduoti dėl išsekusių resursų."
      },
      {
        id: "bucha-massacre-2022",
        year: "2022-03-01 – 2022-03-31",
        title: "Bučos žudynės",
        type: "massacre",
        size: "large",
        image: "assets/photos/Bucha.jpg",
        locations: [
          { place: "Buča", xPct: 0.445449, yPct: 0.660875 }
        ],
        description: "Po Rusijos atsitraukimo rasti masinių civilių žudynių įrodymai. Tarptautinė bendruomenė tai pasmerkė kaip karo nusikaltimus. Įvykis turėjo didelę politinę reikšmę."
      },
      {
        id: "snake-island-battle-2022",
        year: "2022-02-24 – 2022-06-30",
        title: "Gyvačių salos mūšis",
        type: "naval",
        size: "normal",
        image: "assets/photos/Snake_Island.jpg",
        locations: [
          { place: "Gyvačių sala", xPct: 0.444653, yPct: 0.203377 }
        ],
        description: "Sala buvo svarbi Juodosios jūros kontrolei ir oro gynybai. Ukraina nuolat atakavo garnizoną raketomis ir dronais. Galiausiai Rusija buvo priversta pasitraukti."
      },
      {
        id: "severodonetsk-battle-2022",
        year: "2022-05-06 – 2022-06-25",
        title: "Severodonecko mūšis",
        type: "battle",
        size: "normal",
        locations: [
          { place: "Severodoneckas", xPct: 0.838633, yPct: 0.522708 }
        ],
        description: "Vyko intensyvios miesto kovos, primenančios urbanistinį karą. Ukraina patyrė nuostolių ir atsitraukė. Tai atvėrė kelią Rusijai įsitvirtinti Luhansko srityje."
      },
      {
        id: "lysychansk-battle-2022",
        year: "2022-06-25 – 2022-07-03",
        title: "Lysyčansko mūšis",
        type: "battle",
        size: "normal",
        locations: [
          { place: "Lysyčanskas", xPct: 0.835435, yPct: 0.520412 }
        ],
        description: "Po miesto užėmimo Rusija perėmė beveik visą Luhansko sritį. Ukraina atsitraukė į gynybines linijas. Tai buvo laikina Rusijos strateginė sėkmė."
      },
      {
        id: "kremenchuk-mall-strike-2022",
        year: "2022-06-27",
        title: "Kremenčuko prekybos centro bombardavimas",
        type: "strike",
        size: "normal",
        locations: [
